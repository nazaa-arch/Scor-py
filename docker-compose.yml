services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scorpy-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
